<div class="language-switcher">
  @for (langCode of langs; track langCode) {
    <button
      (click)="switchLanguage(langCode)"
      [class.active]="langCode === activeLang()"
      [attr.aria-label]="getLabel(langCode) | async"
    >
      {{ langShortNames[langCode] }}
    </button>
  }
</div>
