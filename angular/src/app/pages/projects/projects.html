<section class="projects-page">
  <div class="container">
    <div class="back-wrapper">
      <a routerLink="/" class="back-link">← Back to Home</a>
    </div>

    <h2>Projects</h2>

    <h3 class="section-title">OpenCV</h3>

    <div class="carousel">
      <button class="arrow arrow-left" (click)="previous()" aria-label="Previous project">‹</button>

      <div class="cards-viewport">
        @for (project of opencvProjects; track project.route; let i = $index) {
          @if (i === currentIndex()) {
            <a [routerLink]="project.route" class="project-card" [ngClass]="getCardClass(i)">
              <div class="card-content">
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <span class="card-tag">{{ project.tag }}</span>
              </div>
            </a>
          } @else {
            <div
              class="project-card"
              [ngClass]="getCardClass(i)"
              (click)="setCurrent(i)"
              (keydown.enter)="setCurrent(i)"
              tabindex="0"
            >
              <div class="card-content">
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <span class="card-tag">{{ project.tag }}</span>
              </div>
            </div>
          }
        }
      </div>

      <button class="arrow arrow-right" (click)="next()" aria-label="Next project">›</button>
    </div>
  </div>
</section>
