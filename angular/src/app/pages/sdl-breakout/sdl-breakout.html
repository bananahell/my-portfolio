<section class="sdl-breakout">

    <a routerLink="/projects" class="back-link">{{ 'sdl.backToProjects' | transloco }}</a>
  </div>

  <h2>{{ 'sdl.breakout.title' | transloco }}</h2>

  <div class="demo-card">
    <div class="demo-area">
      <div class="placeholder">
        <span>🕹️</span>
        <p>{{ 'sdl.breakout.placeholder' | transloco }}</p>
      </div>
    </div>
    <div class="demo-info">
      <h3>{{ 'sdl.breakout.heading' | transloco }}</h3>
      <p>{{ 'sdl.breakout.desc' | transloco }}</p>
      <div class="demo-status">{{ 'sdl.comingSoon' | transloco }}</div>
    </div>
  </div>
</section>
