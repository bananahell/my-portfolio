<section class="sdl-breakout">
  <div class="back-wrapper">
    <a routerLink="/projects" class="back-link">{{ 'sdl.backToProjects' | transloco }}</a>
  </div>

  <h2>{{ 'sdl.breakout.title' | transloco }}</h2>

  <div class="demo-card">
    <div class="demo-area">
      <iframe
        src="/wasm/sdl-game/game.html"
        class="game-iframe"
        title="Breakout game"
        allow="autoplay"
      ></iframe>
    </div>
    <div class="demo-info">
      <h3>{{ 'sdl.breakout.heading' | transloco }}</h3>
      <p>{{ 'sdl.breakout.desc' | transloco }}</p>
      <div class="demo-status">{{ 'general.live' | transloco }}</div>
    </div>
  </div>
</section>
