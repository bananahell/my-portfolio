<section class="hero">
  <div class="hero-content">
    <h1 class="name">Pedro Nogueira</h1>
    <div class="subtitle">
      <span class="typewriter">{{ 'hero.subtitle' | transloco }}</span>
    </div>
    <div class="accent-line"></div>
    <p class="intro">
      {{ 'hero.intro' | transloco }}
    </p>
    <div class="hero-actions">
      <a routerLink="/about" class="btn">{{ 'hero.cta_about' | transloco }}</a>
      <a routerLink="/projects" class="btn btn-outline">{{ 'hero.cta_projects' | transloco }}</a>
    </div>
  </div>
</section>
