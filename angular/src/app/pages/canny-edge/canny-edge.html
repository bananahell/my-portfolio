<section class="canny-edge">
  <div class="back-wrapper">
    <a routerLink="/projects" class="back-link">{{ 'opencv.backToProjects' | transloco }}</a>
  </div>

  <h2>{{ 'opencv.canny.title' | transloco }}</h2>

  <div class="demo-card">
    <div class="demo-area">
      <video #videoElement style="display: none" autoplay playsinline muted></video>
      <canvas #hiddenCanvas style="display: none"></canvas>
      <canvas #canvasElement class="output-canvas"></canvas>
    </div>
    <div class="demo-info">
      <h3>{{ 'opencv.canny.heading' | transloco }}</h3>
      <p>{{ 'opencv.canny.desc' | transloco }}</p>
      <div class="demo-status">{{ 'opencv.live' | transloco }}</div>
    </div>
  </div>
</section>
